; DairyFeed AI — sensor node (ESP32 DevKit)
; Build:  pio run          Upload:  pio run -t upload          Serial:  pio device monitor
; Logic tests (on your PC, no board needed):  pio test -e native

[env:esp32dev]
platform = espressif32@^6
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

; Runs test/ on the PC. Only the hardware-free maths in include/logic.h is tested here.
[env:native]
platform = native
test_build_src = no
